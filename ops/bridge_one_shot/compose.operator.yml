# DORMANT REVIEW ARTIFACT. `config -q` only during development; no `up` approval.
name: signal-desk-bridge-once
x-base: &base
  image: ${HERMES_IMAGE_REF:?immutable host-inspected image required}
  user: "${HERMES_UID:?verified UID required}:${HERMES_GID:?verified GID required}"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
  stop_grace_period: 10s
  restart: "no"
  labels:
    org.signal-desk.issue41.attempt: ${SD_ATTEMPT_ID:?fresh private attempt required}
services:
  inbox-worker:
    <<: *base
    profiles: [execution]
    entrypoint: ["/opt/hermes/.venv/bin/python"]
    command: ["-I", "-B", "-c", "import time; time.sleep(7200)"]
    environment:
      HOME: /worker-home
      HERMES_HOME: /worker-home
      GIT_CONFIG_GLOBAL: /worker-home/gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      TERMINAL_ENV: local
      TMPDIR: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      HTTPS_PROXY: http://172.30.50.3:3128
      HTTP_PROXY: http://172.30.50.3:3128
      ALL_PROXY: http://172.30.50.3:3128
      NO_PROXY: ""
    working_dir: /workspace/runner
    networks:
      worker_isolated: {ipv4_address: 172.30.50.2}
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 128
    volumes:
      - type: bind
        source: ${BRIDGE_RUNNER_HOST:?separate reviewed clone required}
        target: /workspace/runner
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_STATE_PARENT_HOST:?private new state parent required}
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_AUTH_DIR_HOST:?private authorization required}
        target: /private/auth
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_CONTEXT_DIR_HOST:?private context required}
        target: /private/context
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_HOME_HOST:?dedicated credential home required}
        target: /worker-home
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_VENV_HOST:?approved venv required}
        target: /opt/data/signal-desk-tooling/venvs/issue26-recovery-python314-20261030
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_INBOX_CONFIG_HOST:?public verifier/enrollment required}
        target: /private/inbox
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BRIDGE_REVIEW_HOST:?merged helper bundle required}/worker_probe.py
        target: /opt/worker-probe.py
        read_only: true
        bind: {create_host_path: false}

  connect-proxy:
    <<: *base
    profiles: [execution]
    user: "65534:65534"
    entrypoint: ["/opt/hermes/.venv/bin/python"]
    command: ["-B", "/opt/connect-proxy.py"]
    environment: {HOME: /tmp, PYTHONDONTWRITEBYTECODE: "1"}
    networks:
      worker_isolated: {ipv4_address: 172.30.50.3}
      proxy_uplink: {}
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    volumes:
      - type: bind
        source: ${BRIDGE_REVIEW_HOST:?merged helper bundle required}/connect_proxy.py
        target: /opt/connect-proxy.py
        read_only: true
        bind: {create_host_path: false}
networks:
  worker_isolated:
    driver: bridge
    internal: true
    enable_ipv6: false
    labels: {org.signal-desk.issue41.attempt: "${SD_ATTEMPT_ID:?fresh attempt required}"}
    driver_opts:
      com.docker.network.bridge.name: br-sd-once
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{subnet: 172.30.50.0/28}]
  proxy_uplink:
    driver: bridge
    internal: false
    enable_ipv6: false
    labels: {org.signal-desk.issue41.attempt: "${SD_ATTEMPT_ID:?fresh attempt required}"}
    driver_opts:
      com.docker.network.bridge.name: br-sd-uplink
    ipam:
      config: [{subnet: 172.30.51.0/28}]
